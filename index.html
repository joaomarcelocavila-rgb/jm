.chart rect{fill:color-mix(in srgb,var(--ac) 26%,transparent)}.chart rect.on{fill:var(--ac)}

.cpad{padding:18px 18px 12px}
.bar{height:6px;border-radius:4px;background:var(--fill);overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}

/* tables */
.ov{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}

/* sheet */
#m{position:relative;z-index:50}
.md{position:fixed;inset:0;background:var(--scrim);opacity:0;z-index:50}
.sh{position:fixed;z-index:51;background:var(--sf);overflow:auto;overscroll-behavior:contain;box-shadow:var(--sh-3);outline:0;will-change:transform}
.sh.bottom{left:0;right:0;bottom:0;max-height:92dvh;border-radius:var(--r4) var(--r4) 0 0;padding:0 20px calc(26px + env(safe-area-inset-bottom,0px))}

.sh.center .sh-top{height:22px;cursor:default}
.grab{width:38px;height:5px;border-radius:3px;background:var(--fill2)}.sh.center .grab{display:none}
.sh-x{position:absolute;top:14px;right:14px;z-index:3}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:9px;padding:11px 18px 11px 14px;border-radius:99px;background:color-mix(in srgb,var(--ink) 92%,transparent);color:var(--bg);font-weight:550;font-size:14px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--sh-2);opacity:0;pointer-events:none;transform:translate(-50%,28px);max-width:calc(100% - 32px)}

<h1>Política de Privacidade</h1>
<p class="mu">Última atualização: 4 de outubro de 2026</p>

<h2>1. Quem somos</h2>
<p>O MaisOdonto é um aplicativo de gestão para consultórios odontológicos, oferecido por João Marcelo Cavalcanti Ávila, pessoa física responsável pelo aplicativo. Esta política explica quais dados o aplicativo trata, para quê, e quais são os seus direitos segundo a Lei Geral de Proteção de Dados (Lei 13.709/2018, LGPD).</p>

<h2>2. Quais dados tratamos</h2>
<ul>
<li><b>Dados da sua conta:</b> nome, e-mail, senha (guardada de forma criptografada, nem nós conseguimos ler) e o plano escolhido.</li>
<li><b>Dados de pagamento, se você assinar um plano pago:</b> CPF ou CNPJ de quem paga e a situação da assinatura (aguardando pagamento, ativa, atrasada ou cancelada). Os dados do cartão são digitados na página do Asaas e não passam pelo MaisOdonto.</li>
<li><b>Dados do consultório:</b> nome, endereço, telefone, WhatsApp, horário de atendimento, serviços, preços e custos.</li>
<li><b>Dados dos seus pacientes, que você cadastra:</b> nome, WhatsApp, horário predileto, alergias, observações, histórico de consultas, anotações de atendimento e pagamentos.</li>
</ul>
<p>Alergias, anotações de atendimento e outras informações de saúde são dados sensíveis pela LGPD. Em relação aos dados dos pacientes, você, dentista, é o controlador: decide o que cadastrar e para quê. O MaisOdonto é a ferramenta usada para esse tratamento.</p>

<h2>3. Para que usamos</h2>
<ul>
<li>Criar e manter sua conta e o seu consultório no aplicativo.</li>
<li>Mostrar sua agenda, os perfis dos pacientes, o financeiro e a calculadora de lucro.</li>
<li>Montar as mensagens de WhatsApp que você decide enviar.</li>
<li>Receber as sugestões que você nos envia pelo aplicativo.</li>
<li>Cobrar a assinatura dos planos pagos.</li>
</ul>
<p>Não vendemos seus dados nem os dados dos seus pacientes, e não os usamos para publicidade.</p>

<h2>4. Onde os dados ficam guardados</h2>
<p>Os dados da sua conta e do seu consultório ficam guardados no Supabase (supabase.com), o serviço de banco de dados que usamos, em servidores nos Estados Unidos. Por isso, há transferência internacional de dados, feita com as medidas de segurança do fornecedor. O acesso é protegido: cada conta só consegue ler e alterar os próprios dados.</p>
<p>Para o aplicativo abrir mais rápido, uma cópia fica também no navegador do aparelho em que você entra. Ao tocar em Sair, essa cópia é apagada do aparelho.</p>

<h2>5. WhatsApp, sugestões e pagamentos</h2>
<p>Quando você toca em Enviar, o aplicativo abre o seu WhatsApp com a mensagem já escrita. O envio é feito por você, pelo seu número, e segue a política de privacidade do WhatsApp.</p>

<p>Quando você envia uma sugestão, o texto, o e-mail que você informar, o nome do consultório e o seu plano são enviados para <a href="mailto:maisodontosuporte@gmail.com">maisodontosuporte@gmail.com</a> pelo serviço FormSubmit (formsubmit.co). Não inclua dados de pacientes nas sugestões.</p>

<p>Quando você assina um plano pago, seu nome, e-mail e CPF ou CNPJ são enviados ao Asaas (asaas.com), a empresa que processa os pagamentos por Pix, boleto e cartão. O Asaas trata esses dados segundo a política de privacidade dele.</p>

<h2>6. Seus direitos</h2>
<p>Pela LGPD, você pode pedir a confirmação de que tratamos seus dados, o acesso a eles, a correção, a exclusão, a portabilidade e informações sobre compartilhamento, além de revogar o seu consentimento. Você corrige seus dados em Ajustes e pode apagar tudo em Ajustes, na opção Apagar tudo e começar de novo. Para outros pedidos, escreva para <a href="mailto:maisodontosuporte@gmail.com">maisodontosuporte@gmail.com</a>.</p>
<p>Se um paciente pedir para ver, corrigir ou apagar os dados dele, cabe a você atender pelo próprio aplicativo, editando ou apagando as informações dele.</p>

<h2>7. Segurança</h2>
<p>A comunicação com o servidor é criptografada (HTTPS). Recomendamos usar o aplicativo em um aparelho protegido por senha, não compartilhar seu acesso e tocar em Sair ao usar um aparelho de outra pessoa. Avisaremos você caso ocorra algum incidente de segurança que possa trazer risco aos seus dados.</p>

<h2>8. Mudanças nesta política</h2>
<p>Se esta política mudar, a data no topo será atualizada e você será avisado dentro do aplicativo.</p>

<h2>9. Contato</h2>
<p>Dúvidas sobre privacidade: <a href="mailto:maisodontosuporte@gmail.com">maisodontosuporte@gmail.com</a>.</p>
