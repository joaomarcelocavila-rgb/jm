<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Entrar no Clara Odonto</title>
<style>
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,Roboto,"Helvetica Neue",sans-serif;--font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,Roboto,"Helvetica Neue",sans-serif;
--bg:#EEF1F5;--sf:#FFFFFF;--fill:rgba(17,27,41,.05);--fill2:rgba(17,27,41,.09);--thumb:#fff;--ink:#111B29;--mu:#566275;--fa:#8B95A4;--ln:rgba(17,27,41,.09);--ac:#2754E6;--on-ac:#fff;--ca:#D63A3A;--ok:#1B9958;--wt:#C27803;
--sh-2:0 1px 2px rgba(17,27,41,.04),0 12px 32px -10px rgba(17,27,41,.16);--r1:10px;--r3:20px;--r4:28px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B0F15;--sf:#151B24;--fill:rgba(235,240,247,.07);--fill2:rgba(235,240,247,.12);--thumb:#2C3543;--ink:#EBF0F7;--mu:#9DA8B8;--fa:#6E798A;--ln:rgba(235,240,247,.08);--ac:#7090FF;--on-ac:#0A1230;--ca:#FF6B66;--ok:#3DCB82;--wt:#F2A93B;--sh-2:0 0 0 1px rgba(235,240,247,.06),0 16px 40px -12px rgba(0,0,0,.6)}}
:root[data-theme=dark]{--bg:#0B0F15;--sf:#151B24;--fill:rgba(235,240,247,.07);--fill2:rgba(235,240,247,.12);--thumb:#2C3543;--ink:#EBF0F7;--mu:#9DA8B8;--fa:#6E798A;--ln:rgba(235,240,247,.08);--ac:#7090FF;--on-ac:#0A1230;--ca:#FF6B66;--ok:#3DCB82;--wt:#F2A93B;--sh-2:0 0 0 1px rgba(235,240,247,.06),0 16px 40px -12px rgba(0,0,0,.6)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;min-height:100dvh;font:15px/1.5 var(--font);letter-spacing:-.006em;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
h1{font:700 30px/1.1 var(--font-d);letter-spacing:-.026em;margin:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 0;width:min(1160px,100%);margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font:700 18px/1 var(--font-d);letter-spacing:-.02em;text-decoration:none;color:inherit}
.mark{width:32px;height:32px;border-radius:9px;background:var(--ac);color:var(--on-ac);display:grid;place-items:center}.mark .ic{stroke-width:1.6}
.back{color:var(--mu);text-decoration:none;font-weight:500;display:inline-flex;gap:4px;align-items:center;padding:8px 10px;border-radius:10px}.back:hover{background:var(--fill);color:var(--ink)}
main{flex:1;display:grid;place-items:center;padding:32px 16px 48px}
.card{width:min(440px,100%);background:var(--sf);border-radius:var(--r4);box-shadow:var(--sh-2);padding:30px 28px 28px}
.sub{color:var(--mu);margin-top:8px}
.sg{position:relative;display:flex;padding:3px;border-radius:12px;background:var(--fill);isolation:isolate;margin:22px 0 4px}
.sg .th{position:absolute;top:3px;bottom:3px;left:0;border-radius:9px;background:var(--thumb);box-shadow:0 1px 2px rgba(0,0,0,.1),0 3px 8px rgba(0,0,0,.06);z-index:-1}
.sg button{flex:1;height:36px;border:0;background:none;border-radius:9px;font:500 14px/1 var(--font);color:var(--ink);cursor:pointer}.sg button.on{font-weight:650}
label{display:block;font-size:13px;font-weight:500;color:var(--mu);margin:16px 0 6px}
.in{width:100%;height:46px;padding:0 13px;border-radius:var(--r1);border:1px solid transparent;background:var(--fill);color:var(--ink);font:inherit;font-size:16px;outline:0;transition:background-color .15s,border-color .15s,box-shadow .15s}
.in:focus{background:var(--sf);border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
.in[aria-invalid=true]{border-color:var(--ca)}
.err{color:var(--ca);font-size:13.5px;margin-top:6px;min-height:0}
.pw{position:relative}.pw .in{padding-right:76px}.pw button{position:absolute;right:6px;top:7px;height:32px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--ac);font:600 13.5px var(--font);cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.lnk{border:0;background:none;color:var(--ac);font:500 14px var(--font);cursor:pointer;padding:4px 0}
.plans{display:grid;gap:8px}
.plans label{margin:0;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--fill);color:var(--ink);font-size:15px;cursor:pointer;border:1.5px solid transparent;transition:border-color .15s,background-color .15s}
.plans label:has(input:checked){border-color:var(--ac);background:color-mix(in srgb,var(--ac) 7%,var(--sf))}
.plans input{accent-color:var(--ac);width:18px;height:18px;margin:0}.plans b{font-weight:600}.plans span{margin-left:auto;color:var(--mu);font-variant-numeric:tabular-nums}
.b{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;margin-top:24px;border:0;border-radius:14px;background:var(--ac);color:var(--on-ac);font:600 16px/1 var(--font);cursor:pointer;transition:transform .12s ease-out,filter .15s}
.b:hover{filter:brightness(1.07)}.b:active{transform:scale(.97)}.b[disabled]{opacity:.7;pointer-events:none}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--on-ac) 35%,transparent);border-top-color:var(--on-ac);animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.demo{display:flex;gap:10px;align-items:flex-start;margin-top:20px;padding:11px 13px;border-radius:12px;background:color-mix(in srgb,var(--wt) 12%,var(--sf));color:color-mix(in srgb,var(--wt) 55%,var(--ink));font-size:13.5px;font-weight:500}.demo .ic{width:18px;height:18px;margin-top:1px}
.alt{text-align:center;margin-top:18px;color:var(--mu);font-size:14.5px}
.legal{text-align:center;color:var(--fa);font-size:12.5px;margin-top:14px}
[hidden]{display:none!important}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;padding:11px 18px;border-radius:99px;background:color-mix(in srgb,var(--ink) 92%,transparent);color:var(--bg);font-weight:550;font-size:14px;transition:opacity .2s,transform .3s cubic-bezier(.3,1.3,.5,1);pointer-events:none;max-width:calc(100% - 32px)}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-tooth" viewBox="0 0 24 24"><path d="M7 3c-3 0-4 3-3 6s1 5 2 9c.5 2 2 2 2.5 0 .5-3 1-4 2.5-4s2 1 2.5 4c.5 2 2 2 2.5 0 1-4 1-6 2-9s-1-6-4-6c-2 0-2 1-4 1S9 3 7 3z"/></symbol><symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol><symbol id="i-info" viewBox="0 0 24 24"><path d="M12 22a10 10 0 100-20 10 10 0 000 20zM12 11v6M12 7.5v.5"/></symbol></defs></svg>
<div class="top"><a class="brand" href="index.html"><span class="mark"><svg class="ic"><use href="#i-tooth"/></svg></span>Clara Odonto</a><a class="back" href="index.html"><svg class="ic"><use href="#i-back"/></svg>Voltar ao site</a></div>
<main><form class="card" id="f" novalidate>
 <h1 id="t">Entrar</h1><p class="sub" id="s">Bom te ver de novo.</p>
 <div class="sg" id="mode" role="group" aria-label="Entrar ou criar conta"><i class="th"></i><button type="button" data-v="entrar" class="on" aria-pressed="true">Entrar</button><button type="button" data-v="criar" aria-pressed="false">Criar conta</button></div>
 <div id="nmw" hidden><label for="nm">Seu nome</label><input class="in" id="nm" autocomplete="name" placeholder="Ex.: Helena Duarte"><p class="err" id="e_nm"></p></div>
 <label for="em">E-mail</label><input class="in" id="em" type="email" autocomplete="email" inputmode="email" placeholder="voce@consultorio.com.br"><p class="err" id="e_em"></p>
 <label for="pw">Senha</label><div class="pw"><input class="in" id="pw" type="password" autocomplete="current-password" placeholder="Mínimo de 6 caracteres"><button type="button" id="show" aria-label="Mostrar senha">Mostrar</button></div><p class="err" id="e_pw"></p>
 <div class="row" id="fg"><span></span><button type="button" class="lnk" id="forgot">Esqueci minha senha</button></div>
 <div id="plw" hidden><label>Plano para depois do teste</label><div class="plans">
  <label><input type="radio" name="pl" value="solo"><b>Solo</b><span>R$ 79/mês</span></label>
  <label><input type="radio" name="pl" value="consultorio" checked><b>Consultório</b><span>R$ 149/mês</span></label>
  <label><input type="radio" name="pl" value="clinica"><b>Clínica</b><span>R$ 249/mês</span></label></div></div>
 <button class="b" id="go" type="submit">Entrar</button>
 <div class="demo"><svg class="ic"><use href="#i-info"/></svg><span>Versão de demonstração: qualquer e-mail e senha de 6 caracteres funcionam. Nada é enviado para um servidor.</span></div>
 <p class="alt" id="alt"></p><p class="legal" id="legal" hidden>Teste grátis por 14 dias, sem cartão de crédito.</p>
</form></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.getElementById(s),SK='clara-odonto:sess',q=new URLSearchParams(location.search),RM=matchMedia('(prefers-reduced-motion: reduce)');
let mode=q.get('modo')=='criar'?'criar':'entrar';
if(q.get('plano'))document.querySelectorAll('[name=pl]').forEach(r=>r.checked=r.value==q.get('plano'));
function spring(o){let x=o.from,v=0,last=performance.now();const k=(2*Math.PI/.32)**2,c=4*Math.PI/.32;if(RM.matches){o.update(o.to);return}
 const st=n=>{const dt=Math.min((n-last)/1000,1/30);last=n;for(let i=0;i<6;i++){v+=(-k*(x-o.to)-c*v)*dt/6;x+=v*dt/6}if(Math.abs(x-o.to)<.002&&Math.abs(v)<.04){o.update(o.to);return}o.update(x);requestAnimationFrame(st)};requestAnimationFrame(st)}
const sg=$('mode'),th=sg.querySelector('.th');let tx=0,tw=0;
function place(anim){const on=sg.querySelector('.on'),x=on.offsetLeft,w=on.offsetWidth,fx=tx,fw=tw;tx=x;tw=w;const set=(X,W)=>{th.style.transform=`translateX(${X}px)`;th.style.width=W+'px'};anim?spring({from:0,to:1,update:k=>set(fx+(x-fx)*k,fw+(w-fw)*k)}):set(x,w)}
function setMode(m,anim){mode=m;const c=m=='criar';sg.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.v==m);b.setAttribute('aria-pressed',b.dataset.v==m)});place(anim);
 $('t').textContent=c?'Criar sua conta':'Entrar';$('s').textContent=c?'Teste grátis por 14 dias. Leva dois minutos.':'Bom te ver de novo.';
 $('nmw').hidden=!c;$('plw').hidden=!c;$('fg').hidden=c;$('legal').hidden=!c;$('go').textContent=c?'Criar conta e começar':'Entrar';$('pw').autocomplete=c?'new-password':'current-password';
 $('alt').innerHTML=c?'Já tem conta? <button type="button" class="lnk" data-m="entrar">Entrar</button>':'Ainda não usa? <button type="button" class="lnk" data-m="criar">Criar conta grátis</button>';
 history.replaceState(null,'',c?'?modo=criar'+(q.get('plano')?'&plano='+q.get('plano'):''):location.pathname);['nm','em','pw'].forEach(i=>clr(i))}
sg.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.dataset.v!=mode)setMode(b.dataset.v,true)});
$('alt').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b){setMode(b.dataset.m,true);$(b.dataset.m=='criar'?'nm':'em').focus()}});
$('show').addEventListener('click',()=>{const p=$('pw'),s=p.type=='password';p.type=s?'text':'password';$('show').textContent=s?'Ocultar':'Mostrar';$('show').setAttribute('aria-label',s?'Ocultar senha':'Mostrar senha')});
let tt;function toast(m){const t=$('toast');t.textContent=m;t.className='on';clearTimeout(tt);tt=setTimeout(()=>t.className='',3200)}
$('forgot').addEventListener('click',()=>{const e=$('em').value.trim();toast(e?`Na versão final, enviaremos um link para ${e}.`:'Escreva seu e-mail acima para receber o link.')});
function bad(i,m){$(i).setAttribute('aria-invalid','true');$('e_'+i).textContent=m;return 1}
function clr(i){$(i).removeAttribute('aria-invalid');$('e_'+i).textContent=''}
['nm','em','pw'].forEach(i=>$(i).addEventListener('input',()=>clr(i)));
$('f').addEventListener('submit',e=>{e.preventDefault();const c=mode=='criar',nm=$('nm').value.trim(),em=$('em').value.trim(),pw=$('pw').value;let x=0;
 if(c&&!nm)x|=bad('nm','Escreva seu nome.');
 if(!/^\S+@\S+\.\S+$/.test(em))x|=bad('em',em?'Esse e-mail parece incompleto. Confira se tem @ e o domínio.':'Escreva seu e-mail.');
 if(pw.length<6)x|=bad('pw',pw?'A senha precisa de pelo menos 6 caracteres.':'Escreva sua senha.');
 if(x){document.querySelector('[aria-invalid=true]').focus();return}
 const b=$('go');b.disabled=true;b.innerHTML='<span class="spin" aria-hidden="true"></span>'+(c?'Criando sua conta':'Entrando');
 let prev={};try{prev=JSON.parse(localStorage.getItem(SK)||'{}')||{}}catch(_){}
 const pl=(document.querySelector('[name=pl]:checked')||{}).value;
 const sess={email:em,name:c?nm:(prev.email==em?prev.name:'')||'',plano:c?pl:(prev.plano||'consultorio'),trialEnds:c?new Date(Date.now()+14*864e5).toISOString().slice(0,10):(prev.trialEnds||''),at:Date.now()};
 try{localStorage.setItem(SK,JSON.stringify(sess))}catch(_){}
 setTimeout(()=>location.href='clara-odonto.html',RM.matches?0:650)});
setMode(mode,false);addEventListener('resize',()=>place(false));
</script></body></html>
